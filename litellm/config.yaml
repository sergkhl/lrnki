  # DeepSeek platform models (out of credits)
  - model_name: "deepseek/deepseek-v4-pro"
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: os.environ/DEEPSEEK_API_KEY
      input_cost_per_token: 0.000000435
      output_cost_per_token: 0.00000087
      # max_tokens: 8192
      # # Options: "high" (default) or "max"
      # reasoning_effort: "max"
      # # Alternatively, use extra_body for explicit toggle configurations
      # extra_body:
      #   thinking:
      #     type: "enabled" # Set to "disabled" to turn off thinking entirely
    model_info:
      max_input_tokens: 1048576
      max_output_tokens: 393216

  - model_name: "deepseek/deepseek-v4-flash"
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY
      # max_tokens: 8192
    model_info:
      max_input_tokens: 1048576
      max_output_tokens: 393216

  # Same provider model with thinking disabled (required for forced tool_choice in span extraction).
  - model_name: "deepseek/deepseek-v4-flash-no-thinking"
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY
      input_cost_per_token: 0.00000014
      output_cost_per_token: 0.00000028
      extra_body:
        thinking:
          type: "disabled"
    model_info:
      max_input_tokens: 1048576
      max_output_tokens: 393216

  # Mistral Models
  - model_name: "mistral/mistral-small-2603"
    litellm_params:
      model: "mistral/mistral-small-2603"
      api_key: os.environ/MISTRAL_API_KEY

  - model_name: "openai/text-embedding-3-small"
    litellm_params:
      model: "openai/text-embedding-3-small"
      api_key: "os.environ/OPENAI_API_KEY"
      input_cost_per_token: 0.00000002

  # # OpenRouter Models
  - model_name: "openrouter/qwen/qwen3-embedding-8b"
    litellm_params:
      model: "openrouter/qwen/qwen3-embedding-8b"
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0.00000001

  # MiniMax M3 advertises tool_choice on its Minimax endpoint but OpenRouter
  # rejects FORCED tool_choice for it in practice (named, required, provider-
  # pinned, and thinking-off all 404 "No endpoints found that support the
  # provided 'tool_choice' value"). Unusable for forced-tool roles (AGENTS rule 6);
  # kept here only for non-forced use.
  - model_name: "openrouter/minimax/minimax-m3"
    litellm_params:
      model: "openrouter/minimax/minimax-m3"
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0.0000003
      output_cost_per_token: 0.0000012

  # NOTE: openrouter flash
  - model_name: "openrouter/deepseek/deepseek-v4-flash-no-thinking"
    litellm_params:
      model: "openrouter/deepseek/deepseek-v4-flash"
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0.00000009
      output_cost_per_token: 0.00000018
      extra_body:
        thinking:
          type: "disabled"
    model_info:
      max_input_tokens: 1048576
      max_output_tokens: 393216

  - model_name: "openrouter/deepseek/deepseek-v4-pro"
    litellm_params:
      model: "openrouter/deepseek/deepseek-v4-pro"
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0.000000435
      output_cost_per_token: 0.00000087
    model_info:
      max_input_tokens: 1048576
      max_output_tokens: 393216

  # Independent production judge (kg-independent-judge, ADR-0007/0005). gpt-oss-120b
  # is cross-family independent of the DeepSeek extractor, forced tool_choice works,
  # and it is the cheapest option ($0.039/$0.18 per Mtok). Replaces Mistral Small (free-tier rate-limited).
  - model_name: "openrouter/openai/gpt-oss-120b"
    litellm_params:
      model: "openrouter/openai/gpt-oss-120b"
      api_key: os.environ/OPENROUTER_API_KEY

  # Available cheap alternative judge (same Xiaomi family as the author, so weaker
  # triangle independence); kept for reference, not aliased.
  - model_name: "openrouter/xiaomi/mimo-v2.5"
    litellm_params:
      model: "openrouter/xiaomi/mimo-v2.5"
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: "openrouter/xiaomi/mimo-v2.5-pro"
    litellm_params:
      model: "openrouter/xiaomi/mimo-v2.5-pro"
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0.000000435
      output_cost_per_token: 0.00000087
    model_info:
      max_input_tokens: 1048576
      max_output_tokens: 393216

  # - model_name: "openrouter/mistralai/mistral-small-2603"
  #   litellm_params:
  #     model: "openrouter/mistralai/mistral-small-2603"
  #     api_key: os.environ/OPENROUTER_API_KEY

  # Candidate prerequisite judge / independent eval model.
  # Qwen3-235B-A22B-Instruct-2507 is a multilingual MoE model with 22B active
  # parameters, 262K context, strong instruction following / logical reasoning /
  # tool-use positioning, and no thinking-mode blocks. Consider as a non-OpenAI,
  # non-DeepSeek backing-model candidate for kg-prerequisite-ordering (U7 sweep).
  # OpenRouter list price: $0.09 input / $0.10 output per 1M tokens.
  - model_name: "openrouter/qwen/qwen3-235b-a22b-2507"
    litellm_params:
      model: "openrouter/qwen/qwen3-235b-a22b-2507"
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0.00000009
      output_cost_per_token: 0.00000010
    model_info:
      mode: "chat"
      max_input_tokens: 262144

  # Candidate prerequisite judge / schema-reliability eval model.
  # Llama 4 Scout is a Meta MoE model activating 17B parameters out of 109B,
  # with native multimodal support and very large 10M context. Consider as a
  # cheap cross-family judge candidate, especially for provider-pinned structured
  # output experiments; validate forced tool_choice before using in production.
  # OpenRouter list price: $0.10 input / $0.30 output per 1M tokens.
  - model_name: "openrouter/meta-llama/llama-4-scout"
    litellm_params:
      model: "openrouter/meta-llama/llama-4-scout"
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0.00000010
      output_cost_per_token: 0.00000030
    model_info:
      mode: "chat"
      max_input_tokens: 10000000

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY # Required for API key management
  block_robots: true
  # Spend attribution (plan U1/KTD4): the proxy persists per-request token/cost to
  # `LiteLLM_SpendLogs` in a DEDICATED `litellm` Postgres DB, queryable per pipeline
  # stage via `/spend/tags`. The connection is wired by docker-compose.yml
  # (`DATABASE_URL: postgresql://lrnki:lrnki@postgres:5432/litellm`), and the DB itself
  # is provisioned by scripts/docker/postgres/01-init-litellm-db.sh. That env var takes
  # precedence, so the inline `database_url` below stays commented out (moot under
  # compose). The app only LABELS requests with `metadata.tags`; it computes no cost.
  # database_url: "sqlite:///litellm.db"
  store_prompts_in_spend_logs: true
  disable_error_logs: True # turn off writing LLM Exceptions to DB
  alerting: ["slack"]
  # enforce_user_param: true # securiy
  # allowed_ips: ["127.0.0.1", "192.168.1.0/24"]
  # background_health_checks: true
  # health_check_interval: 300

litellm_settings:
  # Logging / monitoring
  # disabled while in dev
  # success_callback: ["langfuse"]
  # failure_callback: ["langfuse"]
  # callbacks: ["prometheus"]
  redact_user_api_key_info: true
  # service_callbacks: ["prometheus"]
  json_logs: true
  drop_params: True
  # enable_json_schema_validation: True

  # # Caching
  # cache: true
  # cache_params:
  #   type: "redis"
  #   host: "localhost"
  #   port: 6379
  #   password: "your-redis-password"
  # ttl: 600  # cache TTL

router_settings:
  routing_strategy: "usage-based-routing-v2"
  num_retries: 0
  retry_after: 5
  # allowed_fails: 1
  enable_pre_call_checks: false
  cooldown_time: 15
  # disable_cooldowns: true
  # default_litellm_params:
  #   temperature: 0.5

  model_group_alias:
    default-model: openrouter/deepseek/deepseek-v4-flash-no-thinking
    kg-concept-discovery: openrouter/deepseek/deepseek-v4-flash-no-thinking
    kg-concept-admission: openrouter/deepseek/deepseek-v4-flash-no-thinking
    kg-claim-extraction: openrouter/deepseek/deepseek-v4-flash-no-thinking
    # Graph Enrichment, third operation (ADR-0019 amended — whole-set ordering, plan
    # U2/U5): ONE ordering call per Declared Domain returns the directed prerequisite
    # DAG over the deduplicated node set. Backed by gpt-oss-120b (reasoning-grade,
    # forced-tool-ok). MEASURED 2026-06-24 (tmp/2026-06-24-deepseek-flash-ordering-rebaseline):
    # deepseek-flash-no-thinking is forced-tool-ok + fast (10s) BUT INADEQUATE for the
    # holistic ordering task — it returned 0 edges for an 11-node Rust domain where
    # gpt-oss-120b produced a correct 11-edge DAG (same node set). Whole-set ordering
    # needs a reasoning model; flash is disproven. OPEN: test deepseek-v4-pro (reasoning,
    # forced-tool-ok @6.7s) as a faster reasoning-grade replacement for gpt-oss-120b's
    # high latency before the TODO #2 stability/K-sampling work.
    kg-prerequisite-ordering: openrouter/openai/gpt-oss-120b
    # Independent production judge (ADR-0007/0005): the concept-vs-proposition
    # admission judge and the optional-assertion entailment judge. gpt-oss-120b is
    # cross-family independent of the DeepSeek extractor, supports forced
    # tool_choice, and is cheap ($0.039/$0.18 per Mtok), so the judge is never the
    # extractor grading its own output. (The off-core oracle triangle and label
    # aligner were retired after the admission-precision fix; see ADR-0013/0022.)
    kg-independent-judge: openrouter/openai/gpt-oss-120b
    # Derived-node semantic-dedup PROPOSE signal (plan U1, ADR-0012, AGENTS rule 20).
    # Embeddings only propose near-duplicate candidate pairs within a Declared Domain;
    # a separate cross-family adjudicator (kg-independent-judge) DECIDES each merge.
    # Never used to derive prerequisites.
    kg-node-embedding: openrouter/qwen/qwen3-embedding-8b
