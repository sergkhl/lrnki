  # # OpenRouter Models
  - model_name: "openrouter/qwen/qwen3-embedding-8b"
    litellm_params:
      model: "openrouter/qwen/qwen3-embedding-8b"
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0.00000001

  # MiniMax M3 advertises tool_choice on its Minimax endpoint but OpenRouter
  # rejects FORCED tool_choice for it in practice (named, required, provider-
  # pinned, and thinking-off all 404 "No endpoints found that support the
  # provided 'tool_choice' value"). Unusable for forced-tool roles (AGENTS rule 6);
  # kept here only for non-forced use.
  - model_name: "openrouter/minimax/minimax-m3"
    litellm_params:
      model: "openrouter/minimax/minimax-m3"
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0.0000003
      output_cost_per_token: 0.0000012

  # Independent reasoning deployment used by prerequisite ordering and claim admission.
  # gpt-oss-120b is cross-family independent of the MiMo extractor. Exact forced named-tool
  # probes on 2026-08-19 qualified DigitalOcean for both the planner's object-array contract
  # and the challenger's nested judgment contract even though OpenRouter's endpoint registry
  # does not advertise tools/tool_choice for that endpoint. `require_parameters` is therefore
  # intentionally omitted: it would incorrectly filter out the qualified primary. A combined
  # DigitalOcean/Groq OpenRouter order still selected Groq because account routing can override
  # provider order, so the primary and backup are separate LiteLLM model groups. This deployment
  # is DigitalOcean-only; router_settings.fallbacks reaches the Groq-only group below on an actual
  # provider error. Replaces Mistral Small (free-tier rate-limited).
  - model_name: "openrouter/openai/gpt-oss-120b"
    litellm_params:
      model: "openrouter/openai/gpt-oss-120b"
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0.00000015
      output_cost_per_token: 0.0000006
      cache_read_input_token_cost: 0.000000075
      # Forced-tool primary: DigitalOcean only. The explicit deny-list is defensive
      # documentation of the historical Google forced-function failure (expedition
      # bd89e63a, 2026-07-06); `only` is the operative boundary.
      extra_body:
        provider:
          only:
            - "digitalocean"
          order:
            - "digitalocean"
          allow_fallbacks: false
          ignore:
            - "google-vertex"
            - "google-ai-studio"

  # Same GPT-OSS-120B model and forced-tool contract, pinned to Groq only. This is never
  # selected by OpenRouter provider ordering; LiteLLM reaches it only through the explicit
  # model-group fallbacks below, so provider identity remains visible in SpendLogs.
  - model_name: "openrouter/openai/gpt-oss-120b-groq-backup"
    litellm_params:
      model: "openrouter/openai/gpt-oss-120b"
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0.00000015
      output_cost_per_token: 0.0000006
      cache_read_input_token_cost: 0.000000075
      extra_body:
        provider:
          only:
            - "groq"
          order:
            - "groq"
          allow_fallbacks: false
          ignore:
            - "google-vertex"
            - "google-ai-studio"

  # Production DeepSeek V4 Flash 0731 primary for the independent judge and both claim roles.
  # Cross-family independent of the MiMo synthesizer, so ADR-0007/0005's "the judge is never the
  # extractor grading its own output" holds. Provider failover is deliberately outside OpenRouter:
  # this group is Baidu-only, and each request alias has an explicit LiteLLM fallback to the
  # DeepInfra-only group below. This preserves provider order despite account routing preferences
  # and leaves the served provider attributable in LiteLLM SpendLogs.
  # `reasoning.enabled: false` is REQUIRED: with reasoning on, DeepSeek double-encodes nested
  # array-of-object tool arguments (the quirk cited in the MiMo comment below), and every judge
  # verdict schema is exactly that shape — an array of per-candidate verdict objects.
  # Do NOT read the 2026-06-24 "deepseek-flash is disproven for whole-set ordering" note on
  # kg-prerequisite-ordering as applying here: that measured a PREVIOUS flash generation, months
  # before this model. It constrains the ordering alias, which still runs gpt-oss-120b, and says
  # nothing about v4-flash-0731. Judge competence on THIS Model Assignment is measured under
  # ADR-0013; this Provider Route change does not substitute for that evidence.
  - model_name: "openrouter/deepseek/deepseek-v4-flash-0731"
    litellm_params:
      model: "openrouter/deepseek/deepseek-v4-flash-0731"
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0.0000000686
      output_cost_per_token: 0.0000001372
      cache_read_input_token_cost: 0.00000001372
      extra_body:
        reasoning:
          enabled: false
        provider:
          require_parameters: true
          quantizations:
            - "fp8"
          only:
            - "baidu/fp8"
          order:
            - "baidu/fp8"
          allow_fallbacks: false
    model_info:
      mode: "chat"
      max_input_tokens: 1048576

  # Same Model Assignment and forced-tool contract, pinned to DeepInfra FP8 only. This group is
  # reached directly for operational proof or through explicit LiteLLM model-group fallbacks;
  # OpenRouter never chooses it as an internal fallback for the Baidu primary.
  - model_name: "openrouter/deepseek/deepseek-v4-flash-0731-deepinfra-backup"
    litellm_params:
      model: "openrouter/deepseek/deepseek-v4-flash-0731"
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0.00000008
      output_cost_per_token: 0.00000018
      cache_read_input_token_cost: 0.000000016
      extra_body:
        reasoning:
          enabled: false
        provider:
          require_parameters: true
          quantizations:
            - "fp8"
          only:
            - "deepinfra/fp8"
          order:
            - "deepinfra/fp8"
          allow_fallbacks: false
    model_info:
      mode: "chat"
      max_input_tokens: 1048576

  # Production extractor (AGENTS rule 5). Forced tool_choice verified across all six
  # extraction roles 2026-07-10. `reasoning.enabled: false` is required: with reasoning
  # on, MiMo double-encodes nested array-of-object tool arguments (emits them as a JSON
  # string and swallows trailing fields inside it), which consistently broke the
  # impostor item's `truths` array (same knob DeepSeek needed, different symptom).
  # A second decoder quirk — MiMo truncates arguments before a trailing literal `null`
  # (an object whose FINAL property admits null) — is now enforced mechanically by
  # infrastructure-litellm/src/mimoDescriptorShape.test.ts, which parses the MiMo-routed
  # aliases from THIS file (model_group_alias below). The price fields are also the
  # source the ADR-0029 cost read path uses to ESTIMATE spend for OpenRouter BYOK rows,
  # which report response cost 0.0 (see LiteLlmSpendLogsReadAdapter); keep them accurate.
  - model_name: "openrouter/xiaomi/mimo-v2.5"
    litellm_params:
      model: "openrouter/xiaomi/mimo-v2.5"
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0.00000014
      output_cost_per_token: 0.00000028
      cache_read_input_token_cost: 0.0000000028
      extra_body:
        reasoning:
          enabled: false
        provider:
          only:
            - "xiaomi"
          order:
            - "xiaomi"
          allow_fallbacks: false
    model_info:
      mode: "chat"
      max_input_tokens: 1048576
      max_output_tokens: 131072

  # Registered for manual experiments only. The current rejection evidence and model-evaluation
  # question are owned by docs/brainstorms/2026-08-08-002-generation-model-evaluation.md.
  - model_name: "openrouter/xiaomi/mimo-v2.5-pro"
    litellm_params:
      model: "openrouter/xiaomi/mimo-v2.5-pro"
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0.000000435
      output_cost_per_token: 0.00000087
      cache_read_input_token_cost: 0.0000000036
      extra_body:
        # Same knob, same reason as the v2.5 deployment below: with reasoning on the MiMo
        # family double-encodes nested array-of-object tool arguments. Set so a comparison
        # against v2.5 measures the model, not a known-broken decoder configuration.
        reasoning:
          enabled: false
        provider:
          only:
            - "xiaomi"
          order:
            - "xiaomi"
          allow_fallbacks: false
    model_info:
      mode: "chat"
      max_input_tokens: 1048576
      max_output_tokens: 393216

  # Native Xiaomi MiMo deployment (LiteLLM first-class `xiaomi_mimo/` provider),
  # direct to api.xiaomimimo.com instead of the OpenRouter middle-hop. The provider
  # defaults api_base to https://api.xiaomimimo.com/v1 and normally reads
  # XIAOMI_MIMO_API_KEY, but api_key is pinned to XIAOMI_API_KEY here. Reasoning is
  # disabled via the NATIVE dialect (`thinking.type: "disabled"`), which is the
  # api.xiaomimimo.com analog of OpenRouter's `reasoning.enabled: false` — required
  # by AGENTS rule 5 (production extraction runs MiMo v2.5 with reasoning off).
  # Single upstream host means prefix caching warms inherently (no provider-pin
  # needed) but there is no failover — a xiaomi outage stalls extraction.
  # EXPERIMENTS ONLY — do NOT alias production traffic here. Measured 2026-07-11
  # against the BYOK OpenRouter path (same underlying model): native is faster
  # (~0.9s vs ~1.1-1.9s warm, less jitter), warms prefix cache to full prefix, and
  # is the only path LiteLLM records a real per-token cost for (BYOK reports
  # response-cost 0.0, blinding the ADR-0029 cost lens). BUT it enforces forced
  # tool_choice only NON-DETERMINISTICALLY (same run: one call returned plain text
  # "Biology", the next returned the tool call; a third free-formed JSON with the
  # wrong key). That violates ADR-0006 / AGENTS rule 6, so the production extractor
  # stays on openrouter/xiaomi/mimo-v2.5. Same failure class as minimax-m3 above.
  - model_name: "xiaomi_mimo/mimo-v2.5"
    litellm_params:
      model: "xiaomi_mimo/mimo-v2.5"
      api_key: os.environ/XIAOMI_API_KEY
      input_cost_per_token: 0.00000014
      output_cost_per_token: 0.00000028
      cache_read_input_token_cost: 0.0000000028
      extra_body:
        thinking:
          type: "disabled"
    model_info:
      mode: "chat"
      max_input_tokens: 1048576
      max_output_tokens: 131072

  # - model_name: "openrouter/mistralai/mistral-small-2603"
  #   litellm_params:
  #     model: "openrouter/mistralai/mistral-small-2603"
  #     api_key: os.environ/OPENROUTER_API_KEY

  # Candidate prerequisite judge / schema-reliability eval model.
  # Llama 4 Scout is a Meta MoE model activating 17B parameters out of 109B,
  # with native multimodal support and very large 10M context. Consider as a
  # cheap cross-family judge candidate, especially for provider-pinned structured
  # output experiments; validate forced tool_choice before using in production.
  # OpenRouter list price: $0.10 input / $0.30 output per 1M tokens.
  - model_name: "openrouter/meta-llama/llama-4-scout"
    litellm_params:
      model: "openrouter/meta-llama/llama-4-scout"
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0.00000010
      output_cost_per_token: 0.00000030
      # Backs kg-knowledge-boundary-probe (forced tool_choice). Google (Vertex)
      # rejects forced function calling (tool_choice mode=ANY) with 400, so it is
      # deny-listed outright (real failure: expedition "Enzyme Kinetics",
      # 2026-07-06). `require_parameters: true` was tried but over-restricted routing
      # to Groq alone — which is frequently upstream-rate-limited (429) — so it is
      # NOT set; the deny-list lets OpenRouter reach the other tool-capable providers
      # (Fireworks, DeepInfra, …) that serve llama-4-scout.
      extra_body:
        provider:
          ignore:
            - "google-vertex"
            - "google-ai-studio"
    model_info:
      mode: "chat"
      max_input_tokens: 10000000

  # Fallback deployment for kg-knowledge-boundary-probe (see router_settings.fallbacks).
  # llama-4-scout honors forced tool_choice ONLY via Groq on OpenRouter, and a sustained
  # Groq 429 stalls K=5 generation (real outage 2026-07-06). Qwen3-30B-A3B is a small MoE
  # (~3B active — preserves the "small model K-dispersion reveals the boundary" design),
  # cross-family from the MiMo synthesizer (KTD4 independence holds), and is reliably
  # served with forced tool_choice by non-Groq providers (measured 4/4 via StreamLake).
  # Engaged only when the primary probe deployment fails.
  - model_name: "openrouter/qwen/qwen3-30b-a3b-instruct-2507"
    litellm_params:
      model: "openrouter/qwen/qwen3-30b-a3b-instruct-2507"
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0.00000008
      output_cost_per_token: 0.00000029
    model_info:
      mode: "chat"
      max_input_tokens: 262144

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY # Required for API key management
  block_robots: true
  # Spend attribution (plan U1/KTD4): the proxy persists per-request token/cost to
  # `LiteLLM_SpendLogs` in a DEDICATED `litellm` Postgres DB, queryable per pipeline
  # stage via `/spend/tags`. The connection is wired by docker-compose.yml
  # (`DATABASE_URL: postgresql://lrnki:lrnki@postgres:5432/litellm`), and the DB itself
  # is provisioned by scripts/docker/postgres/01-init-litellm-db.sh. That env var takes
  # precedence, so the inline `database_url` below stays commented out (moot under
  # compose). The app only LABELS requests with `metadata.tags`; it computes no cost.
  # database_url: "sqlite:///litellm.db"
  store_prompts_in_spend_logs: true
  disable_error_logs: True # turn off writing LLM Exceptions to DB
  alerting: ["slack"]
  # enforce_user_param: true # securiy
  # allowed_ips: ["127.0.0.1", "192.168.1.0/24"]
  # background_health_checks: true
  # health_check_interval: 300

litellm_settings:
  # Logging / monitoring
  # disabled while in dev
  # success_callback: ["langfuse"]
  # failure_callback: ["langfuse"]
  # callbacks: ["prometheus"]
  redact_user_api_key_info: true
  # service_callbacks: ["prometheus"]
  json_logs: true
  drop_params: True
  # enable_json_schema_validation: True

  # # Caching
  # cache: true
  # cache_params:
  #   type: "redis"
  #   host: "localhost"
  #   port: 6379
  #   password: "your-redis-password"
  # ttl: 600  # cache TTL

router_settings:
  routing_strategy: "usage-based-routing-v2"
  num_retries: 0
  retry_after: 5
  # allowed_fails: 1
  enable_pre_call_checks: false
  cooldown_time: 15
  # Explicit cross-deployment fallbacks, keyed on the request aliases. The knowledge-boundary
  # probe retains its small cross-family Qwen backup. GPT-OSS roles move from DigitalOcean to
  # same-model Groq only after an error. All three DeepSeek roles move from Baidu to the shared
  # same-assignment DeepInfra group. Separate groups keep every provider route attributable.
  fallbacks:
    - kg-knowledge-boundary-probe: ["openrouter/qwen/qwen3-30b-a3b-instruct-2507"]
    - kg-claim-verification-planner: ["openrouter/openai/gpt-oss-120b-groq-backup"]
    - kg-independent-judge: ["openrouter/deepseek/deepseek-v4-flash-0731-deepinfra-backup"]
    - kg-claim-verification-answerer: ["openrouter/deepseek/deepseek-v4-flash-0731-deepinfra-backup"]
    - kg-claim-factuality-judge: ["openrouter/deepseek/deepseek-v4-flash-0731-deepinfra-backup"]
    - kg-claim-factuality-challenger: ["openrouter/openai/gpt-oss-120b-groq-backup"]
    - kg-prerequisite-ordering: ["openrouter/openai/gpt-oss-120b-groq-backup"]
  # disable_cooldowns: true
  # default_litellm_params:
  #   temperature: 0.5

  model_group_alias:
    # Extraction routes to Xiaomi MiMo v2.5 via OpenRouter, provider-pinned to the
    # single xiaomi host (provider.only + allow_fallbacks: false on the deployment).
    # The pin matters for prefix caching: OpenRouter load-balancing spreads requests
    # across upstream hosts whose prefix caches are per-host, so the ~23k-token
    # document re-sent on every admission batch never warms under load balancing.
    # A single pinned host CAN warm it (cache_read_input_token_cost is set on the
    # deployment). Trade-off: no failover — a xiaomi-host outage stalls extraction.
    default-model: openrouter/xiaomi/mimo-v2.5
    kg-concept-discovery: openrouter/xiaomi/mimo-v2.5
    kg-concept-admission: openrouter/xiaomi/mimo-v2.5
    # Production generation assignment. The unresolved DeepSeek comparison, its evidence gap, and
    # scope options are owned by docs/brainstorms/2026-08-08-002-generation-model-evaluation.md.
    kg-claim-extraction: openrouter/xiaomi/mimo-v2.5
    # Synthetic topic generation, second pipeline arm (ADR-0019 amended, plan
    # 2026-06-30-001). Concept-set synthesis is the source-less analog of Candidate
    # Discovery, so it stays on the production extractor family (AGENTS rule 5). The
    # knowledge-boundary probe is a SMALL cross-family alias (llama-4-scout, Meta MoE
    # ~17B active) independent of the MiMo synthesizer (KTD4): the K-sampled
    # dispersion of a small model exposes its knowledge boundary. Forced tool_choice on
    # the probe alias is empirically verified before locking (U2 verification); its
    # moderate probe temperature is set on the client the worker constructs, not here.
    # Reliability: this deployment honors forced tool_choice only via Groq on OpenRouter,
    # so router_settings.fallbacks routes to a small cross-family Qwen3-30B-A3B deployment
    # when a sustained Groq 429 would otherwise stall generation.
    kg-concept-synthesis: openrouter/xiaomi/mimo-v2.5
    kg-knowledge-boundary-probe: openrouter/meta-llama/llama-4-scout
    # Target-aware verification planning and draft-blind answering use reasoning-grade deployments
    # under separately attributable aliases. U1's literal-strength discrimination matrix found that
    # the former small shared deployment could turn a proposed assertion into a leading question and
    # then repeat it as an answer. GPT-OSS-120B plans; pinned DeepSeek V4 Flash 0731 answers without
    # target text. Neither settles learner text. Two independently sampled evidence packets reach
    # the panel below, with a third complete packet only for an unreplicated objection.
    kg-claim-verification-planner: openrouter/openai/gpt-oss-120b
    kg-claim-verification-answerer: openrouter/deepseek/deepseek-v4-flash-0731
    # Final Grounding Admission factuality panel. Separate role aliases preserve consumer
    # attribution without changing any other kg-independent-judge consumer.
    # DeepSeek 0731 and its Baidu→DeepInfra Provider Route are owned above; the
    # challenger is provider-pinned GPT-OSS-120B. The families showed complementary blind spots,
    # so neither settles alone: a model vetoes only after independently repeating the same rejection
    # across separately planned and answered packets.
    kg-claim-factuality-judge: openrouter/deepseek/deepseek-v4-flash-0731
    kg-claim-factuality-challenger: openrouter/openai/gpt-oss-120b
    # Learner generation helper: infer a Declared Domain from the learner's
    # topic inside source-less concept generation. Stays on the production
    # extractor (AGENTS rule 5).
    kg-domain-inference: openrouter/xiaomi/mimo-v2.5
    # Graph Enrichment, third operation (ADR-0019 amended — whole-set ordering, plan
    # U2/U5): ONE ordering call per Declared Domain returns the directed prerequisite
    # DAG over the deduplicated node set. Backed by gpt-oss-120b (reasoning-grade,
    # forced-tool-ok). MEASURED 2026-06-24, on the deepseek flash generation available THEN
    # ("deepseek-flash-no-thinking", months before v4-flash-0731): forced-tool-ok + fast (10s) BUT
    # INADEQUATE for the holistic ordering task — it returned 0 edges for an 11-node Rust domain where
    # gpt-oss-120b produced a correct 11-edge DAG (same node set). Whole-set ordering needs a
    # reasoning model. Scope: this disproves THAT model on THIS task, and is not evidence about a
    # later flash generation or about per-item judging — do not generalize it (the judge alias moved
    # to v4-flash-0731 on 2026-08-07 for reasons of its own). Measured 2026-07-07:
    # openrouter/qwen/qwen3-235b-a22b-2507 was forced-tool OK and faster but failed
    # quality parity, so the incumbent stays.
    kg-prerequisite-ordering: openrouter/openai/gpt-oss-120b
    # Independent production judge (ADR-0007/0005): the concept-vs-proposition admission judge, the
    # optional-assertion entailment judge, semantic-dedup merge adjudication, and Study Item Key
    # Verification. Grounding factuality is deliberately owned by the claim-specific alias above
    # after its separate U1 qualification. DeepSeek v4 flash is cross-family independent of
    # the MiMo extractor, so the judge is never the extractor grading its own output, and it is
    # cheaper than the gpt-oss-120b it replaced.
    # ONE Model Assignment, deliberately: the provider-only fallback is attributable through
    # LiteLLM SpendLogs and does not mix model revision, quantization, or inference behavior. Moving
    # off the Groq-pinned gpt-oss-120b also removes the shared-account request-rate ceiling that took
    # out every judge stage at once on 2026-08-07. Provider qualification and the FP8-only lock are
    # owned by the deployments above; never widen this alias to an unmeasured provider or quantization.
    # (The off-core oracle triangle and label aligner were retired after the admission-precision fix;
    # see ADR-0013.)
    kg-independent-judge: openrouter/deepseek/deepseek-v4-flash-0731
    # Derived-node semantic-dedup PROPOSE signal (plan U1, ADR-0012, AGENTS rule 20).
    # Embeddings only propose near-duplicate candidate pairs within a Declared Domain;
    # a separate cross-family adjudicator (kg-independent-judge) DECIDES each merge.
    # Never used to derive prerequisites.
    kg-node-embedding: openrouter/qwen/qwen3-embedding-8b
