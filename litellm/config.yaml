      # input_cost_per_token: 0.000001
      # output_cost_per_token: 0.000002
      # max_tokens: 8192
  - model_name: "gemini/gemma-4-31b-it"
    litellm_params:
      model: gemini/gemma-4-31b-it
      api_key: os.environ/GOOGLE_API_KEY
      rpm: 15
      tpm: 1000000
    model_info:
      mode: "chat"
      # input_cost_per_token: 0.000001
      # output_cost_per_token: 0.000002
      # max_tokens: 8192
  - model_name: "gemini/gemma-4-26B-A4B-it"
    litellm_params:
      model: gemini/gemma-4-26B-A4B-it
      api_key: os.environ/GOOGLE_API_KEY
      rpm: 15
      tpm: 1000000
    model_info:
      mode: "chat"
      # input_cost_per_token: 0.000001
      # output_cost_per_token: 0.000002
      # max_tokens: 8192

  - model_name: "gemini/gemini-embedding-001"
    litellm_params:
      model: gemini/gemini-embedding-001
      api_key: os.environ/GOOGLE_API_KEY
      # drop_params: true
      # additional_drop_params: ["temperature", "top_p", "max_tokens", "stream"]

  - model_name: "gemini/gemini-2.5-flash-preview-tts"
    litellm_params:
      model: gemini/gemini-2.5-flash-preview-tts
      api_key: os.environ/GOOGLE_API_KEY
      rpm: 3

  - model_name: "gemini/gemini-2.5-flash"
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GOOGLE_API_KEY
      rpm: 5
      tpm: 250000
    model_info:
      mode: "chat"
      # input_cost_per_token: 0.000001
      # output_cost_per_token: 0.000002
      # max_tokens: 8192

  - model_name: "gemini/gemini-2.5-flash-lite"
    litellm_params:
      model: gemini/gemini-2.5-flash-lite
      api_key: os.environ/GOOGLE_API_KEY
      rpm: 10
      tpm: 250000
    model_info:
      mode: "chat"
      # input_cost_per_token: 0.000001
      # output_cost_per_token: 0.000002
      # max_tokens: 8192


  - model_name: "deepseek/deepseek-v4-pro"
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: os.environ/DEEPSEEK_API_KEY
      input_cost_per_token: 0.000000435
      output_cost_per_token: 0.00000087
      # max_tokens: 8192
      # # Options: "high" (default) or "max"
      # reasoning_effort: "max"
      # # Alternatively, use extra_body for explicit toggle configurations
      # extra_body:
      #   thinking:
      #     type: "enabled" # Set to "disabled" to turn off thinking entirely
    model_info:
      max_input_tokens: 1048576
      max_output_tokens: 393216

  - model_name: "deepseek/deepseek-v4-flash"
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY
      # max_tokens: 8192
    model_info:
      max_input_tokens: 1048576
      max_output_tokens: 393216

  # Same provider model with thinking disabled (required for forced tool_choice in span extraction).
  - model_name: "deepseek/deepseek-v4-flash-no-thinking"
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY
      input_cost_per_token: 0.00000014
      output_cost_per_token: 0.00000028
      extra_body:
        thinking:
          type: "disabled"
    model_info:
      max_input_tokens: 1048576
      max_output_tokens: 393216

  # Mistral Models
  - model_name: "mistral/mistral-small-2603"
    litellm_params:
      model: "mistral/mistral-small-2603"
      api_key: os.environ/MISTRAL_API_KEY

  - model_name: "openai/text-embedding-3-small"
    litellm_params:
      model: "openai/text-embedding-3-small"
      api_key: "os.environ/OPENAI_API_KEY"
      input_cost_per_token: 0.00000002

  # # OpenRouter Models
  - model_name: "openrouter/qwen/qwen3-embedding-4b"
    litellm_params:
      model: "openrouter/qwen/qwen3-embedding-4b"
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0.00000002

  - model_name: "openrouter/qwen/qwen3-embedding-8b"
    litellm_params:
      model: "openrouter/qwen/qwen3-embedding-8b"
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0.00000001

  # MiniMax M3 advertises tool_choice on its Minimax endpoint but OpenRouter
  # rejects FORCED tool_choice for it in practice (named, required, provider-
  # pinned, and thinking-off all 404 "No endpoints found that support the
  # provided 'tool_choice' value"). Unusable as a forced-tool oracle author
  # (AGENTS rule 6); kept here only for non-forced use. See ADR-0013.
  - model_name: "openrouter/minimax/minimax-m3"
    litellm_params:
      model: "openrouter/minimax/minimax-m3"
      api_key: os.environ/OPENROUTER_API_KEY
      input_cost_per_token: 0.0000003
      output_cost_per_token: 0.0000012

  # Oracle reference author (ADR-0013). Independent of the DeepSeek extractor and
  # the Mistral judge; all of Xiaomi's OpenRouter providers support forced
  # tool_choice, so the reference author honors AGENTS rule 6.
  - model_name: "openrouter/xiaomi/mimo-v2.5-pro"
    litellm_params:
      model: "openrouter/xiaomi/mimo-v2.5-pro"
      api_key: os.environ/OPENROUTER_API_KEY

  # NOTE: tencent/hy3-preview advertises tool_choice but its backend only accepts
  # tool_choice="auto" (not forced/named) — unusable for forced tools (rule 6).
  - model_name: "openrouter/tencent/hy3-preview"
    litellm_params:
      model: "openrouter/tencent/hy3-preview"
      api_key: os.environ/OPENROUTER_API_KEY

  # Oracle second judge (kg-oracle-judge), and the ADR-0007/0005 production judges.
  # gpt-oss-120b is cross-family independent of BOTH the DeepSeek extractor and the
  # Xiaomi reference author (true triangle independence), forced tool_choice works,
  # and it is the cheapest option ($0.039/$0.18 per Mtok). Replaces Mistral Small
  # (free-tier rate-limited) and Nemotron (too expensive at $2.5/Mtok out).
  - model_name: "openrouter/openai/gpt-oss-120b"
    litellm_params:
      model: "openrouter/openai/gpt-oss-120b"
      api_key: os.environ/OPENROUTER_API_KEY

  # Available cheap alternative judge (same Xiaomi family as the author, so weaker
  # triangle independence); kept for reference, not aliased.
  - model_name: "openrouter/xiaomi/mimo-v2.5"
    litellm_params:
      model: "openrouter/xiaomi/mimo-v2.5"
      api_key: os.environ/OPENROUTER_API_KEY

  # Available but UNUSED: Nemotron is independent + forced-tool capable but its
  # output is expensive ($2.5/Mtok); not aliased to any role.
  - model_name: "openrouter/nvidia/nemotron-3-ultra-550b-a55b"
    litellm_params:
      model: "openrouter/nvidia/nemotron-3-ultra-550b-a55b"
      api_key: os.environ/OPENROUTER_API_KEY

  # - model_name: "openrouter/mistralai/mistral-small-2603"
  #   litellm_params:
  #     model: "openrouter/mistralai/mistral-small-2603"
  #     api_key: os.environ/OPENROUTER_API_KEY

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY # Required for API key management
  block_robots: true
  # database_url: "sqlite:///litellm.db"
  store_prompts_in_spend_logs: true
  disable_error_logs: True # turn off writing LLM Exceptions to DB
  alerting: ["slack"]
  # enforce_user_param: true # securiy
  # allowed_ips: ["127.0.0.1", "192.168.1.0/24"]
  # background_health_checks: true
  # health_check_interval: 300

litellm_settings:
  # Logging / monitoring
  # disabled while in dev
  # success_callback: ["langfuse"]
  # failure_callback: ["langfuse"]
  # callbacks: ["prometheus"]
  redact_user_api_key_info: true
  # service_callbacks: ["prometheus"]
  json_logs: true
  drop_params: True
  # enable_json_schema_validation: True

  # # Caching
  # cache: true
  # cache_params:
  #   type: "redis"
  #   host: "localhost"
  #   port: 6379
  #   password: "your-redis-password"
  # ttl: 600  # cache TTL

router_settings:
  routing_strategy: "usage-based-routing-v2"
  num_retries: 0
  retry_after: 5
  # allowed_fails: 1
  enable_pre_call_checks: false
  cooldown_time: 15
  # disable_cooldowns: true
  # default_litellm_params:
  #   temperature: 0.5

  model_group_alias:
    default-model: deepseek/deepseek-v4-flash-no-thinking
    kg-concept-discovery: deepseek/deepseek-v4-flash-no-thinking
    kg-concept-admission: deepseek/deepseek-v4-flash-no-thinking
    kg-claim-extraction: deepseek/deepseek-v4-flash-no-thinking
    # Graph Enrichment, third operation (ADR-0019): contextual embeddings gate
    # prerequisite pairs (ADR-0012 tier 2, propose-only); the bounded judge
    # proposes the inferred DAG using the same no-thinking extractor.
    kg-concept-embedding: openrouter/qwen/qwen3-embedding-8b
    kg-prerequisite-judgment: deepseek/deepseek-v4-flash-no-thinking
    # Oracle roles must be independent of the production extractor (ADR-0013:
    # "the production extraction model must not grade itself"). Three families:
    # DeepSeek extracts, Xiaomi MiMo authors references, Mistral audits.
    # (MiniMax M3 was the intended author but cannot do forced tool_choice via
    # OpenRouter; Xiaomi MiMo v2.5 Pro is the independent forced-tool substitute.)
    # Oracle roles keep default reasoning enabled; the no-thinking discipline
    # applies to production extraction cost, not rare benchmark runs.
    kg-oracle-reference: openrouter/xiaomi/mimo-v2.5-pro
    # gpt-oss-120b: cheap ($0.039/$0.18) and cross-family independent of both the
    # extractor (DeepSeek) and the author (Xiaomi). Replaces Mistral (rate-limited)
    # and Nemotron (expensive). Also backs the ADR-0007/0005 production judges.
    kg-oracle-judge: openrouter/openai/gpt-oss-120b
