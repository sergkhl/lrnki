services:
  postgres:
    image: postgres:18.4-alpine
    container_name: lrnki-postgres
    networks:
      - lrnki
    environment:
      POSTGRES_USER: lrnki
      POSTGRES_PASSWORD: lrnki
      POSTGRES_DB: lrnki
    ports:
      # Host publish only. POSTGRES_HOST_PORT is defined once in the repo-root .env (which compose
      # auto-loads) and is the same value the DSNs there carry; the container keeps listening on
      # 5432, which is what every service-name DSN on the `lrnki` network uses.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      # Named volume: path-independent, so no guard applies.
      - postgres_data:/var/lib/postgresql
      # Every file bind in this file is fail-closed. `create_host_path: false` is the whole point:
      # by default Docker CREATES a missing bind source as an empty directory, so a caller whose
      # paths this daemon cannot resolve silently gets a directory mounted over an init script or a
      # config file. That is not hypothetical — it is how the `/workspace/lrnki` debris on the VPS
      # was produced, by compose run inside an agent container that binds the workspace at a
      # different path (ADR-0040). Every source below is a tracked repo file, so it exists in any
      # valid checkout; the only state this can refuse is a caller resolving the wrong path.
      # Guards `up`, not `watch` on already-running containers, and not `down`.
      - type: bind
        source: ./scripts/docker/postgres/01-init-litellm-db.sql
        target: /docker-entrypoint-initdb.d/01-init-litellm-db.sql
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./scripts/docker/postgres/02-init-test-db.sql
        target: /docker-entrypoint-initdb.d/02-init-test-db.sql
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lrnki -d lrnki"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Bring the application schema to current before any process can query it, through the same
  # programmatic migrator the host uses. It applies the sole baseline to an empty database and is a
  # no-op on a current one; every legacy/partial/stale/unexpected-history state exits nonzero and
  # demands an explicit reset, because changing the greenfield schema means resetting the database
  # rather than migrating it incrementally (ADR-0039). Deliberately one-shot: never restarted,
  # and never destructive on its own.
  #
  # Runs the learner-api image with an overridden command rather than an image of its own. That
  # image already carries everything the migrator needs — its `COPY . .` brings the migrations
  # folder, and `--filter @lrnki/learner-api...` installs the workspace closure, which includes
  # @lrnki/infrastructure-postgres and (no `--prod`) the tsx that runs the CLI. A second Dockerfile
  # was therefore building an image whose distinguishing content was a strict subset of this one.
  # It stays a separate SERVICE, not a step in the API's entrypoint, because the deploy reads this
  # container's exit code before recreating the API: a refused migration must leave the previous
  # API container running rather than crash-looping the new one.
  #
  # No `build:` here, so the image must already exist — the deploy builds learner-api first, and a
  # cold `docker compose up -d` needs `--build`. The tag is pinned on learner-api rather than left
  # to compose's project-derived default so this reference cannot drift with COMPOSE_PROJECT_NAME.
  migrate:
    image: lrnki-learner-api
    command: ["pnpm", "--filter", "@lrnki/infrastructure-postgres", "run", "db:migrate"]
    container_name: lrnki-migrate
    networks:
      - lrnki
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://lrnki:lrnki@postgres:5432/lrnki
    restart: "no"

  litellm:
    image: ghcr.io/berriai/litellm:v1.88.1
    container_name: lrnki-litellm
    networks:
      - lrnki
    ports:
      # Bound to loopback (U3): Docker's iptables rules bypass ufw, so a 0.0.0.0 publish would
      # expose LiteLLM on the public VPS interface. Host-run admin-lab/kg-worker still reach it
      # via localhost; containers use the `litellm` service name over the lrnki network.
      - "127.0.0.1:4000:4000"
    volumes:
      # Fail-closed like the postgres binds above — reason documented there.
      - type: bind
        source: ./litellm/config.yaml
        target: /app/config.yaml
        read_only: true
        bind:
          create_host_path: false
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://lrnki:lrnki@postgres:5432/litellm
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 90s

  # Mixed-format ingestion for Gate 2 (ADR-0013): PDF/DOCX/PPTX → structured
  # document via the Docling HTTP API. Version-pinned so the parsed-layout
  # contract stays reproducible across the frozen oracle suite.
  docling:
    build:
      context: ./docling
      dockerfile: Dockerfile
    container_name: lrnki-docling
    networks:
      - lrnki
    ports:
      # Loopback-only (U3): same public-exposure hazard as litellm above.
      - "127.0.0.1:5001:5001"
    environment:
      DOCLING_SERVE_ENABLE_UI: "1"
      DOCLING_DEVICE: "cpu"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  # Learner HTTP API (U2 / ADR-0035). No published host port — only Caddy reaches it over the
  # lrnki network. The relocated topic-generation supervisor runs inside this long-lived process,
  # so these LiteLLM credentials are also its production generation credentials.
  #
  # This container is the ONLY process that serves the public API (ADR-0040). The dev loop starts
  # or reuses it detached, then attaches `docker compose watch --no-up learner-api` rather than
  # shadowing it with a second host runtime, so there is exactly one thing that can answer on 8787
  # and one source of its env.
  learner-api:
    build:
      context: .
      dockerfile: apps/learner-api/Dockerfile
    # Pinned explicitly, not left to compose's `<project>-<service>` default: the `migrate` service
    # above references this tag, and a project-name override would otherwise repoint it.
    image: lrnki-learner-api
    container_name: lrnki-learner-api
    networks:
      - lrnki
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      litellm:
        condition: service_healthy
    # Identity and sessions (ADR-0041). These carry NO compose default on purpose: an empty
    # `BETTER_AUTH_SECRET` makes the API refuse to start, which is the whole point — Better Auth
    # otherwise falls back to a secret published in its own source and only rejects that fallback
    # when NODE_ENV=production, which this repo deliberately leaves unset. A loud boot failure
    # beats a container that silently signs every learner's cookie with a public key.
    environment:
      DATABASE_URL: postgresql://lrnki:lrnki@postgres:5432/lrnki
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_API_KEY: ${LITELLM_API_KEY:-sk-local}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://api.lrnki.globesoul.com}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Edit-on-host / run-in-container dev loop: `pnpm dev:api` starts the existing image without a
    # build and attaches Compose Watch with `--no-up`. WORKDIR /app + `COPY . .` map the repo root
    # to /app, so these targets are exact and the in-image workspace symlinks stay valid under a
    # plain file sync. Initial sync catches edits made while no watcher was attached; later source
    # edits sync and restart without a build. A lockfile change is the one case a sync cannot serve:
    # it needs a real in-image install, hence `rebuild` or the explicit `pnpm dev:api:rebuild`.
    develop:
      watch:
        - action: sync+restart
          path: ./apps/learner-api/src
          target: /app/apps/learner-api/src
          initial_sync: true
        - action: sync+restart
          path: ./packages
          target: /app/packages
          initial_sync: true
          ignore:
            - "**/node_modules/"
        - action: rebuild
          path: ./pnpm-lock.yaml

  # Public TLS terminator (U2): owns 80/443 and reverse-proxies to the learner API. Nothing else
  # on the VPS owns those ports, so Caddy joins this compose file directly. The Caddyfile is baked
  # into a built image (not bind-mounted — the daemon's FS view diverges from the checkout, so
  # file binds break); config change => `docker compose up -d --build caddy`. Caddy reaches its one
  # upstream over the lrnki network, so it needs no route to the host (ADR-0040).
  #
  # Profiled because it is meaningful only on the host that owns the public hostname. Off that host
  # it endlessly retries ACME for api.lrnki.globesoul.com — which cannot succeed, since Let's Encrypt
  # validates against the VPS. So a plain `docker compose up -d` skips it, and the shared host opts
  # in with COMPOSE_PROFILES=public in its .env. The deploy script is unaffected either way: naming a
  # profiled service explicitly (it passes `caddy` to both build and up) activates its profile.
  caddy:
    build:
      context: ./scripts/docker/caddy
    container_name: lrnki-caddy
    profiles: ["public"]
    networks:
      - lrnki
    restart: unless-stopped
    depends_on:
      learner-api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

networks:
  lrnki:
    name: lrnki
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-lrnki

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
