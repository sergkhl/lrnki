services:
  postgres:
    image: postgres:18.4-alpine
    container_name: lrnki-postgres
    networks:
      - lrnki
    environment:
      POSTGRES_USER: lrnki
      POSTGRES_PASSWORD: lrnki
      POSTGRES_DB: lrnki
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/docker/postgres/01-init-litellm-db.sh:/docker-entrypoint-initdb.d/01-init-litellm-db.sh:ro
      - ./scripts/docker/postgres/02-init-test-db.sh:/docker-entrypoint-initdb.d/02-init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lrnki -d lrnki"]
      interval: 5s
      timeout: 5s
      retries: 5

  litellm:
    image: ghcr.io/berriai/litellm:v1.88.1
    container_name: lrnki-litellm
    networks:
      - lrnki
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://lrnki:lrnki@postgres:5432/litellm
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 90s

  # Mixed-format ingestion for Gate 2 (ADR-0013): PDF/DOCX/PPTX → structured
  # document via the Docling HTTP API. Version-pinned so the parsed-layout
  # contract stays reproducible across the frozen oracle suite.
  docling:
    build:
      context: ./docling
      dockerfile: Dockerfile
    container_name: lrnki-docling
    networks:
      - lrnki
    ports:
      - "5001:5001"
    environment:
      DOCLING_SERVE_ENABLE_UI: "1"
      DOCLING_DEVICE: "cpu"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  lrnki:
    name: lrnki
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-lrnki

volumes:
  postgres_data:
