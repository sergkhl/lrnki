packages:
  - "apps/*"
  - "packages/*"

# React Native / Metro / Babel tooling assumes a flat node_modules; the isolated
# linker hides preset-referenced Babel plugins (e.g. @babel/plugin-transform-react-jsx),
# breaking the Expo web/native bundle. Per Expo's monorepo guidance and plan 2026-07-09-001
# U2, hoist for the whole workspace rather than play whack-a-mole with hoist patterns.
nodeLinker: hoisted
catalogMode: strict
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
strictDepBuilds: true
sharedWorkspaceLockfile: true
linkWorkspacePackages: false
preferWorkspacePackages: false

catalog:
  "@base-ui/react": 1.5.0
  "@playwright/test": 1.60.0
  "@tailwindcss/postcss": 4.3.0
  "@types/node": 25.9.2
  "@types/react": 19.2.15
  "@types/react-dom": 19.2.3
  class-variance-authority: 0.7.1
  clsx: 2.1.1
  eslint: 9.39.1
  eslint-config-next: 16.2.6
  lucide-react: 1.16.0
  motion: 12.42.2
  next: 16.2.6
  pdf-parse: 2.4.5
  postgres: 3.4.9
  react: 19.2.3
  react-dom: 19.2.3
  shadcn: 4.8.1
  tailwind-merge: 3.6.0
  tailwindcss: 4.3.0
  tw-animate-css: 1.4.0
  tsx: 4.21.0
  typescript: 6.0.3
  zod: 4.4.3
  "@faker-js/faker": 9.9.0
  cytoscape: 3.33.4
  '@types/cytoscape': 3.21.9
  playwright: ^1.60.0
  undici: ^8.7.0
  hono: 4.12.28
  "@hono/node-server": 2.0.8
  "@hono/zod-validator": 0.8.0
  "@tanstack/react-router": 1.170.17
  "@tanstack/react-query": 5.101.2
  vite: 8.1.3
  "@vitejs/plugin-react": 6.0.3

# Expo universal learner app (plan 2026-07-09-001). Named catalog because NativeWind 4
# requires Tailwind 3 while the web apps use Tailwind 4 from the default catalog.
catalogs:
  expo:
    expo: ~57.0.4
    expo-constants: ~57.0.3
    expo-dev-client: ~57.0.4
    expo-linking: ~57.0.2
    expo-router: ~57.0.4
    expo-secure-store: ~57.0.0
    expo-status-bar: ~57.0.0
    react-native: 0.86.0
    react-native-web: ~0.21.0
    react-native-safe-area-context: ~5.7.0
    react-native-screens: 4.25.2
    react-native-svg: 15.15.5
    "@react-native-async-storage/async-storage": 3.1.1
    nativewind: 4.2.6
    babel-preset-expo: ~57.0.2
    tailwindcss: 3.4.19
    lucide-react-native: 1.23.0
    "@types/react": ~19.2.2
    react-native-reanimated: ~4.5.0
    react-native-worklets: 0.10.0
    expo-haptics: ~57.0.0
    "@expo/ui": ~57.0.4
    "@rn-primitives/dialog": 1.5.2
    "@rn-primitives/portal": 1.5.2
    jest: ~29.7.0
    jest-expo: ~57.0.1
    "@testing-library/react-native": 14.0.1
    test-renderer: ^1.2.0

allowBuilds:
  esbuild: true
  msw: false
  sharp: true
  unrs-resolver: true
