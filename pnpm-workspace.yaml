packages:
  - "apps/*"
  - "packages/*"

# React Native / Metro / Babel tooling assumes a flat node_modules; the isolated linker hides
# preset-referenced Babel plugins, so the Expo workspace remains hoisted.
nodeLinker: hoisted
catalogMode: strict
minimumReleaseAge: 1440
minimumReleaseAgeStrict: true
strictDepBuilds: true
sharedWorkspaceLockfile: true
linkWorkspacePackages: false
preferWorkspacePackages: false

# NativeWind v5's migration guide requires this exact serializer until its current
# preview no longer needs the compatibility pin.
overrides:
  lightningcss: 1.30.1

catalog:
  "@playwright/test": 1.60.0
  "@tailwindcss/postcss": 4.3.0
  "@types/node": 25.9.2
  "@types/react": 19.2.15
  "@types/react-dom": 19.2.3
  eslint: 9.39.1
  eslint-plugin-react: 7.37.5
  eslint-plugin-react-hooks: 7.1.1
  typescript-eslint: 8.61.0
  postgres: 3.4.9
  react: 19.2.3
  react-dom: 19.2.3
  tailwindcss: 4.3.0
  tsx: 4.21.0
  typescript: 6.0.3
  zod: 4.4.3
  drizzle-kit: 0.31.10
  drizzle-orm: 0.45.2
  postcss: 8.5.17
  hono: 4.12.28
  better-auth: 1.6.26
  "@better-auth/expo": 1.6.26
  "@hono/node-server": 2.0.8
  "@hono/zod-validator": 0.8.0
  "@tanstack/react-query": 5.101.2
  expo-build-properties: ~57.0.15

# Expo universal learner app. NativeWind v5 is the supported NativeWind/Reanimated 4
# integration for Expo SDK 57's always-on New Architecture.
catalogs:
  expo:
    expo: ~57.0.18
    "@expo/dom-webview": ~57.0.1
    "@expo/metro-runtime": ~57.0.14
    expo-constants: ~57.0.16
    expo-dev-client: ~57.0.16
    expo-linking: ~57.0.8
    expo-router: ~57.0.17
    expo-secure-store: ~57.0.2
    expo-web-browser: ~57.0.2
    expo-network: ~57.0.1
    expo-status-bar: ~57.0.1
    react-native: 0.86.3
    react-native-web: ~0.21.0
    react-native-safe-area-context: ~5.7.0
    react-native-screens: ~4.26.0
    react-native-svg: 15.15.4
    "@react-native-async-storage/async-storage": 2.2.0
    nativewind: 5.0.0-preview.4
    react-native-css: 3.0.7
    babel-preset-expo: ~57.0.2
    lucide-react-native: 1.23.0
    "@types/react": ~19.2.2
    react-native-reanimated: 4.5.1
    react-native-worklets: 0.10.1
    expo-haptics: ~57.0.2
    expo-font: ~57.0.2
    "@expo-google-fonts/im-fell-english": 0.4.0
    "@expo/ui": ~57.0.14
    "@rn-primitives/dialog": 1.5.2
    "@rn-primitives/portal": 1.5.2
    jest: ~29.7.0
    jest-expo: ~57.0.5
    "@testing-library/react-native": 14.0.1
    test-renderer: ^1.2.0

allowBuilds:
  esbuild: true
  msw: false
  sharp: true
  unrs-resolver: true
