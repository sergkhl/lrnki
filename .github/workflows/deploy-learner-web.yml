# Learner web deploy: builds the Expo universal app's static web export and publishes it to
# GitHub Pages on every push to main (plan 2026-07-09-001 U5). The API base is hardcoded here —
# the one file that consumes it — because the hostname is stable and public.
name: Deploy learner web

on:
  push:
    branches: [main]
    # Only rebuild when something that affects the web export changes.
    paths:
      - "apps/learner-app/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-learner-web.yml"
  workflow_dispatch:

# Pages deploy permissions (OIDC) required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deploys at once; let an in-flight run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Cheap correctness gate before we spend a Pages deploy on a broken build.
      - run: pnpm --filter @lrnki/learner-app typecheck
      - run: pnpm --filter @lrnki/learner-app test

      # Custom domain (lrnki.globesoul.com) serves from root. The app reads
      # EXPO_PUBLIC_LEARNER_API_URL at build time (apps/learner-app/src/lib/api.ts).
      - run: pnpm --filter @lrnki/learner-app export:web
        env:
          EXPO_PUBLIC_LEARNER_API_URL: https://api.lrnki.globesoul.com

      # Pages SPA fallback: deep links like /expedition/:id resolve to the router
      # instead of a Pages 404.
      - run: cp apps/learner-app/dist/index.html apps/learner-app/dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/learner-app/dist

      - id: deploy
        uses: actions/deploy-pages@v4
