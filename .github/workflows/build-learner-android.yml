# Android APK for the learner app, built ON the GitHub runner (`eas build --local` — no EAS
# build credits, ubuntu runners ship Java + the Android SDK) and uploaded as a workflow
# artifact to download and sideload. Auth is the EXPO_TOKEN repo secret; the EAS project
# identity lives in apps/learner-app/app.json (extra.eas.projectId).
name: Build learner Android APK

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "eas.json build profile"
        type: choice
        default: preview
        options: [preview, development]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 11.4.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - run: pnpm install --frozen-lockfile

      # Cheap correctness gate before spending ~15 min of Gradle on a broken tree.
      - run: pnpm --filter @lrnki/learner-app typecheck
      - run: pnpm --filter @lrnki/learner-app test

      # The preview profile is a standalone APK against the live API (the one shared learner
      # environment; see README "Deployment"); the development profile needs `expo start` as its
      # dev server. The script is the canonical invocation (also `pnpm build:android` locally);
      # with no .env on the runner it reads EXPO_TOKEN from the step environment.
      - name: Build APK locally on the runner
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: scripts/build-learner-android.sh ${{ inputs.profile }}

      - uses: actions/upload-artifact@v6
        with:
          name: lrnki-learner-${{ inputs.profile }}-apk
          path: apps/learner-app/lrnki-learner-${{ inputs.profile }}.apk
          retention-days: 14
