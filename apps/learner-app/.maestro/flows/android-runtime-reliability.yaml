# Retained Android Support Path authority. The real e2e APK talks to the authored qualifier and
# learner runtime through the loopback fixture; only identity persistence and Postgres are replaced.
# The body and footer assertions are the negative-control-sensitive oracle for the historical
# narrow-dialog collapse. Trail scrolling remains navigation evidence only.
appId: com.globesoul.lrnki
---
- launchApp:
    clearState: true
- assertVisible: "Choose your explorer"
- tapOn:
    id: "gate-e2e-signin"
- assertVisible: "Expedition journal"

# The deterministic fixture has completed scored Stops, so a fresh app state must surface the
# retained first-visit board celebration. Dismiss it before navigating away from the journal.
- assertVisible: "You climbed the board!"
- tapOn: "Close"

- tapOn: "Resume trail"
- assertVisible: "See the support structure"

- swipe:
    direction: UP
    duration: 600
- swipe:
    direction: UP
    duration: 600
- swipe:
    direction: UP
    duration: 600
- swipe:
    direction: UP
    duration: 600
- swipe:
    direction: UP
    duration: 600
- swipe:
    direction: UP
    duration: 600
- swipe:
    direction: UP
    duration: 600
- swipe:
    direction: UP
    duration: 600
- assertVisible:
    id: "support-path-review-support-relationship"
- tapOn:
    id: "support-path-review-support-relationship"
    enabled: true

# Negative-control-sensitive dialog oracle: title alone is insufficient.
- assertVisible: "Support Path"
- assertVisible: "This branch reuses ordinary acquisition evidence.*"
- assertVisible: "Keep exploring"
- takeScreenshot: authored-support-path-dialog
- tapOn: "Keep exploring"

# Closing restores the same authored trail, not a blank or stale generation surface.
- assertVisible:
    id: "support-path-review-support-relationship"
- assertNotVisible: "This branch reuses ordinary acquisition evidence.*"

# The retained board opens through the real menu/portal path and paints content.
- back
- assertVisible: "Expedition journal"
- tapOn: "Menu"
- tapOn: "View the board"
- assertVisible: "This week’s climbers"
- assertVisible: "Native Capture.*"
