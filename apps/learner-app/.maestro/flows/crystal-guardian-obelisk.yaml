# Crystal Guardian Ward Obelisk — native VISUAL-EVIDENCE flow (Ward Obelisk plan U4, ADR-0038).
#
# WHY IT EXISTS. The obelisk separates resolved / current / queued wards by fill, facet, gloss and
# contour weight rather than by hue. The web gate rendered those primitives through Chromium's SVG;
# Android renders the same primitives through react-native-svg's NATIVE canvas — exactly where the
# two earlier Android-only overlay defect classes hid. So the five ward states have to be reached on
# a real APK and looked at.
#
# WHAT IT IS AUTHORITY FOR: nothing automatic. Under ADR-0038 a native scenario earns automatic
# authority only from a measured negative control, and no negative control has been run for obelisk
# segment rendering — a luminance/facet difference is a judgement, not an assertion. The
# `assertVisible` lines here only PROVE THE FLOW REACHED THE INTENDED STATE, so the screenshot beside
# them is evidence of that state and not of some other one. The verdict is human/agent inspection of
# the captured PNGs.
#
# The five states are driven through the deterministic five-ward Leg challenge in
# `e2e-native/guardianFixture.ts`, whose combat state is folded by the production pure functions.
# Answering rotates a missed ward to the back of the queue, which is what lets three deliberate
# misses walk the shield 3 -> 0 into Last Stand without resolving anything.
#
# The fixture login (${LEARNER_EMAIL}/${LEARNER_PASSWORD}) and the challenge id
# (${GUARDIAN_CHALLENGE_ID}) are passed by the runner via `maestro test -e`, so no id or credential
# is duplicated in this file.
appId: com.globesoul.lrnki
---
- launchApp:
    clearState: true

# Email + password sign-in: the fallback route and the only one any rig drives (ADR-0041).
- assertVisible: "Choose your explorer"
- tapOn:
    id: "gate-email"
- inputText: ${LEARNER_EMAIL}
- tapOn:
    id: "gate-password"
- inputText: ${LEARNER_PASSWORD}
- hideKeyboard
- tapOn: "Enter"
- assertVisible: "Choose an expedition"

# Enter the fight directly. Trail-entry navigation is already owned by the web layers; what is
# unproven on Android is the SVG body itself, so this flow spends its whole length on the Guardian.
- openLink: lrnki://guardian/${GUARDIAN_CHALLENGE_ID}

# --- 1. Entry, 5 of 5 wards. Exactly one current segment and it is at the BASE; the complete
# silhouette is already drawn to the crown; the shield reads 3/3 below the body. ---
- assertVisible: "Crystal Guardian"
- assertVisible: ".*5 wards left.*Shield 3/3.*"
- takeScreenshot: guardian-1-entry-5-of-5

# --- 2. Partial, 2 resolved / 1 current / 2 queued. THE POINT OF THE PASS. Resolved-versus-queued
# is the weakest visual pair: it rests on a luminance step plus the queued facet, and at the
# rendered 180 px the crown's facet is small. Judge WITHOUT reading hue whether a bare stone slot
# and a lit-facet slot are still distinguishable on the device panel. ---
- tapOn: "Osmosis carries water toward the more concentrated side"
- assertVisible: "Ward broken!"
- tapOn: "Continue"
- assertVisible: ".*4 wards left.*Shield 3/3.*"
- tapOn: "Active transport spends ATP against the gradient"
- assertVisible: "Ward broken!"
- tapOn: "Continue"
- assertVisible: ".*3 wards left.*Shield 3/3.*"
- takeScreenshot: guardian-2-partial-2-resolved

# --- 3. A miss. The shield drops by one and the ward segmentation does NOT move: still two stone
# slots at the base, one current boundary, two queued above. (The wards-left count is unchanged
# here, which is the whole KTD8 claim — a miss costs shield, never ward progress.) ---
- tapOn: "Endocytosis dissolves the particle in the bilayer"
- assertVisible: "The ward holds"
- tapOn: "Continue"
- assertVisible: ".*3 wards left.*Shield 2/3.*"
- takeScreenshot: guardian-3-miss-shield-2

# --- 4. Last Stand, shield 0/3. All three ward states on screen at once under the destructive
# ring; the wards stay exactly where they were. ---
- tapOn: "A hypotonic solution draws water out"
- assertVisible: "The ward holds"
- tapOn: "Continue"
- assertVisible: ".*3 wards left.*Shield 1/3.*"
- tapOn: "Fluid mosaic structure admits some and blocks others"
- assertVisible: "The ward holds"
- tapOn: "Continue"
- assertVisible: "Last Stand"
- assertVisible: ".*3 wards left.*Shield 0/3.*"
- takeScreenshot: guardian-4-last-stand

# --- 5. Final Ward, 1 remaining: the current segment IS the crown, beside the visible `Final ward`
# line. Two clean answers get there; the first also restores exactly one shield segment, which is
# the recovery rule the production fold owns. ---
- tapOn: "Endocytosis wraps the particle in membrane"
- assertVisible: "Ward broken!"
- tapOn: "Continue"
- assertVisible: ".*2 wards left.*Shield 1/3.*"
- tapOn: "A hypertonic solution draws water out"
- assertVisible: "Ward broken!"
- tapOn: "Continue"
- assertVisible: ".*Final ward.*Shield 1/3.*"
- takeScreenshot: guardian-5-final-ward-crown

# --- The win edge (KTD9): a committed win renders NO won Guardian — the fight hands straight off to
# the Crystal Formation reward, so the last thing the body ever shows is the Final Ward above. ---
- tapOn: "Selective permeability admits some and blocks others"
- assertVisible: "Ward broken!"
- takeScreenshot: guardian-6-final-reveal

# --- The other duel, at the SEVEN-ward maximum. Two things to judge here that five wards cannot
# show: whether the summit's pink trident crown still reads as a different Guardian from the Leg's
# orange diamond, and whether the facet survives the tightest band the body ever draws (the shaft is
# divided into `wardTotal - 1` bands, so seven wards is the thinnest each one gets). ---
- openLink: lrnki://guardian/${SUMMIT_CHALLENGE_ID}
- assertVisible: "Expedition Guardian"
- assertVisible: ".*7 wards left.*Shield 3/3.*"
- takeScreenshot: guardian-7-expedition-seven-ward
