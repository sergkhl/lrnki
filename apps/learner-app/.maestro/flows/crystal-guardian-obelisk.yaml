# Native Guardian visual smoke. This deliberately makes no automatic rendering claim: no negative
# control exists for the obelisk facets. The screenshots establish only that both authored scopes
# reached the intended native SVG presentation.
appId: com.globesoul.lrnki
---
- launchApp:
    clearState: true
- assertVisible: "Choose your explorer"
- tapOn:
    id: "gate-e2e-signin"
- assertVisible: "Expedition journal"
- assertVisible: "You climbed the board!"
- tapOn: "Close"

- openLink: lrnki://guardian/${EXPEDITION_KEY}/${GUARDIAN_CHALLENGE_ID}
- assertVisible: "Leg Guardian"
- assertVisible: ".*wards remain.*"
- assertVisible: "Shield 3/3.*"
- takeScreenshot: authored-leg-guardian-entry

- openLink: lrnki://guardian/${EXPEDITION_KEY}/${SUMMIT_CHALLENGE_ID}
- assertVisible: "Expedition Guardian"
- assertVisible: ".*wards remain.*"
- assertVisible: "Shield 3/3.*"
- takeScreenshot: authored-expedition-guardian-entry
